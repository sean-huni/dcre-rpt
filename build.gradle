plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'za.co.fnb.dcre'
version = '2.0'
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
repositories { mavenCentral(); mavenLocal() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'za.co.fnb.dcre:platform-persistence:0.1.0'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-liquibase'
    implementation 'za.co.fnb.dcre:platform-batch:0.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.testcontainers:cockroachdb:1.21.4'
}
test { useJUnitPlatform() }

// Spec 2026-07-15 client-stats section 6 guard 1: every client-facing view carries the
// session-identity predicate. Ops changelog views use current_user too, so the scan is uniform.
tasks.register('verifyViewPredicates') {
    group = 'verification'
    doLast {
        def offenders = []
        fileTree('src/main/resources/db/changelog').matching { include '**/*.xml' }.each { f ->
            def text = f.text
            def matcher = text =~ /(?s)<createView[^>]*viewName="([^"]+)"[^>]*>(.*?)<\/createView>/
            matcher.each { full, viewName, body ->
                if (!body.contains('current_user')) {
                    offenders << "${f.name}: ${viewName}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Views missing session-identity predicate: ${offenders}")
        }
    }
}
check.dependsOn 'verifyViewPredicates'
